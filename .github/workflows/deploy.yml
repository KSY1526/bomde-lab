# main에 push하면 GitHub Pages로 배포 (저장소 Settings → Pages → Source: GitHub Actions)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4
        env:
          # 챗봇·댓글 서버 주소: 저장소 Settings → Secrets and variables → Actions → Variables 에 KBOT_API 등록
          PUBLIC_KBOT_API: ${{ vars.KBOT_API }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # 새로 올리거나 고친 글 주소를 IndexNow로 네이버(+빙 등)에 바로 알린다 (2026-10-16).
  # 키 파일은 public/<키>.txt → bomdelab.com/<키>.txt. 구글은 IndexNow를 받지 않는다.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      KEY: 34cdc7565fac34409b58e9937442ee9e
      SITE: https://bomdelab.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 바뀐 글 주소 알리기
        run: |
          before="${{ github.event.before }}"
          urls=()
          if [ -n "$before" ] && git cat-file -e "$before" 2>/dev/null; then
            while read -r f; do
              [ -f "$f" ] || continue                      # 지운 글은 건너뜀
              grep -q '^draft: true' "$f" && continue      # 초안은 건너뜀
              slug=$(basename "$f"); slug="${slug%.*}"
              urls+=("$SITE/posts/$slug/")
            done < <(git diff --name-only "$before" "${{ github.sha }}" -- 'src/content/posts/*.md' 'src/content/posts/*.mdx')
          fi
          if [ ${#urls[@]} -eq 0 ]; then echo "바뀐 글 없음"; exit 0; fi
          urls+=("$SITE/")                                 # 새 글이 홈 목록에도 올라가므로 홈도 같이
          printf '%s\n' "${urls[@]}"
          body=$(jq -n --arg key "$KEY" --arg loc "$SITE/$KEY.txt" '{host:"bomdelab.com", key:$key, keyLocation:$loc, urlList:$ARGS.positional}' --args "${urls[@]}")
          for ep in https://searchadvisor.naver.com/indexnow https://api.indexnow.org/indexnow; do
            code=$(curl -s -o /tmp/res -w '%{http_code}' -X POST "$ep" -H 'Content-Type: application/json; charset=utf-8' -d "$body")
            echo "$ep → $code $(head -c 300 /tmp/res)"
          done
